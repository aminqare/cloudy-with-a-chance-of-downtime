name: Refresh multi-source weather snapshot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh weather snapshot
        run: node scripts/update-weather-snapshot.mjs

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/network-weather/data/weather-conditions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh multi-source weather snapshot"
          git push
